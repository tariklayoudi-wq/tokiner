name: Probe external Apple Shortcut signing
on:
  push:
    branches: [ci/iphone-shortcuts-pack-20261012]
    paths: [.github/workflows/iphone-shortcuts-sign-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Generate harmless local demonstration shortcut
        run: |
          python3 - <<'PY'
          import plistlib,uuid,json
          d={'WFWorkflowName':'AI Commander Signature Probe','WFWorkflowClientVersion':'2607.1','WFWorkflowMinimumClientVersion':900,
          'WFWorkflowIcon':{'WFWorkflowIconGlyphNumber':61440,'WFWorkflowIconStartColor':1440408063},
          'WFWorkflowActions':[{'WFWorkflowActionIdentifier':'is.workflow.actions.showresult',
          'WFWorkflowActionParameters':{'UUID':str(uuid.uuid4()).upper(),'Text':'AI Commander signature probe. No external action.'}}],
          'WFWorkflowInputContentItemClasses':['WFStringContentItem'],'WFWorkflowTypes':[]}
          with open('sign-probe.unsigned.shortcut','wb') as f:plistlib.dump(d,f,fmt=plistlib.FMT_BINARY)
          with open('sign-payload.json','w') as f:json.dump({'shortcutName':'AI Commander Signature Probe','shortcut':plistlib.dumps(d,fmt=plistlib.FMT_XML).decode()},f)
          PY
      - name: Sign using HubSign RoutineHub service (no private data)
        shell: bash
        run: |
          set -euo pipefail
          curl --connect-timeout 10 --max-time 90 --fail-with-body --show-error -sS \
            -H 'Content-Type: application/json' \
            -H 'User-Agent: cherri/1.0' \
            -H 'Origin: https://routinehub.co' \
            -H 'Referer: https://routinehub.co/' \
            --data-binary @sign-payload.json \
            'https://hubsign.routinehub.services/sign' \
            -o sign-probe.signed.shortcut
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sign-probe.signed.shortcut')
          b=p.read_bytes()
          print('SIGNED_SIZE',len(b),'MAGIC',repr(b[:4]))
          assert b.startswith(b'AEA1') and len(b)>1000
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: apple-signed-shortcuts-probe
          path: sign-probe.signed.shortcut
