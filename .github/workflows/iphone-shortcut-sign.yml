name: Sign standalone iPhone AI shortcuts (temporary)
on:
  push:
    branches:
      - ci/iphone-shortcuts-pack-20261012
    paths:
      - .github/workflows/iphone-shortcut-sign.yml
jobs:
  sign_shortcuts:
    runs-on: macos-15
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build and Apple-sign two shortcuts
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/iphone_builder.xz.b64 <<'PAYLOAD'
          
          PAYLOAD
          base64 -D -i /tmp/iphone_builder.xz.b64 -o /tmp/iphone_builder.xz
          xz -d -c /tmp/iphone_builder.xz > /tmp/build_shortcut.py
          python3 /tmp/build_shortcut.py
          mkdir -p shortcut-dist
          for f in /tmp/*.unsigned.shortcut; do
            [ -f "$f" ] || continue
            n=$(basename "$f" .unsigned.shortcut)
            shortcuts sign --mode anyone --input "$f" --output "shortcut-dist/$n.shortcut"
            test -s "shortcut-dist/$n.shortcut"
            file "shortcut-dist/$n.shortcut"
          done
          test -f shortcut-dist/AI-Commander-iPhone.shortcut
          test -f shortcut-dist/AI-Commander-Launchpad.shortcut
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add shortcut-dist
          git commit -m "Generate Apple-signed AI Commander shortcuts"
          git push origin HEAD:ci/iphone-shortcuts-pack-20261012
