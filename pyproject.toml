[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "free-cred"
version = "0.0.0"
description = "Provider-agnostic, quota-aware router for Hermes Agent (minimal PoC)"
license = { text = "MIT" }
requires-python = ">=3.12"

[tool.pytest]
addopts = "-q"
