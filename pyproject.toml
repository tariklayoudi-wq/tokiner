[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "free-cred"
version = "0.0.0"
description = "Provider-agnostic, quota-aware router for Hermes Agent (minimal PoC)"
license = { text = "MIT" }
requires-python = ">=3.12"

# Non-secret configuration for local demo (FastAPI, testing)
dependencies = [
    "fastapi>=0.95",
    "openai>=1.0",
    "uvicorn>=0.22",
    "httpx>=0.24",
    "pytest>=7.0"
]

[tool.pytest]
addopts = ["-q"]
markers = [
    "integration: tests that call real external providers when credentials are available"
]

[tool.setuptools.packages.find]
include = ["free_cred*"]
